name: "salesforce-pipeline"
run-name: "salesforce pipeline run"

on:
  push:

jobs:
  setup-salesforce:
    name: "setup salesforce"
    runs-on: "ubuntu-latest"

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: "Set-Up Salesforce CLI" 
        run: npm install --global @salesforce/cli

      - name: " check the latest version SF CLI"
        run: sf --version

      - name: "Install Salesforce code analyzer"
        run: sf plugins install code-analyzer

      - name: Authorize salesforce org
        run: sf org login sfdx-url --sfdx-url-file tmp/authFile.txt --set-default --alias Myprodorg